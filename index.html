<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Book Reader</title>
  <meta name="description" content="خواننده‌ی تعاملی کتاب؛ بخش‌بندی، ساده‌سازی متن، یادداشت، پرسش و پیگیری پیشرفت خواندن">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='18' y='22' width='30' height='58' rx='4' fill='%231e6b3f'/%3E%3Crect x='52' y='22' width='30' height='58' rx='4' fill='%232f8f4b'/%3E%3Cline x1='48' y1='28' x2='52' y2='28' stroke='%23a97c1f' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="#/"><span class="brand-mark">❦</span><span class="brand-name">خواننده‌ی تعاملی کتاب</span></a>
        <nav id="topnav" class="topnav">
          <a href="#/" data-nav="home">خانه</a>
          <span id="nav-book-anchor"></span>
        </nav>
        <button id="reset-btn" class="btn btn-ghost btn-sm" title="پاک کردن پیشرفت مطالعه">↺ ریست</button>
      </div>
    </header>
    <main id="view" class="container view"></main>
    <footer class="footer container">
      <div class="foot-ornament">❦</div>
      <p>خواننده‌ی تعاملی کتاب — قفسه‌ی مطالعه‌ی تو. محتوای این‌جا ساده‌سازی شده است و جایگزینِ کتابِ اصلی نیست.</p>
    </footer>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js?v=6"></script>
</body>
</html>
